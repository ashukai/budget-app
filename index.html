<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget + Savings</title>
<meta name="description" content="A personal salary-day planner. Your data lives in your own private storage, not in this app.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('budget-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Layout: a phone app. Bottom tab bar (Today · Month · Budget · Grow) on iPhone, a sidebar on the Mac,
   one column of iOS inset-grouped lists. One accent colour, money green. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --side:#e9e9ef; --bar:rgba(242,242,247,.88);
  --ink:#111114; --muted:#6c6c72; --faint:#a3a3aa; --hair:rgba(60,60,67,.17);
  --fill:rgba(118,118,128,.12); --fill-strong:rgba(120,120,128,.26); --seg-on:#ffffff;
  --accent:#0d7a4c; --accent-ink:#ffffff; --accent-soft:rgba(13,122,76,.09); --warn:#b4530a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --side:#111113; --bar:rgba(10,10,12,.86);
  --ink:#f5f5f7; --muted:#9a9aa1; --faint:#636368; --hair:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(120,120,128,.4); --seg-on:#636366;
  --accent:#3ec488; --accent-ink:#03140c; --accent-soft:rgba(62,196,136,.14); --warn:#ffb15c;
  color-scheme:dark;
} }
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --side:#111113; --bar:rgba(10,10,12,.86);
  --ink:#f5f5f7; --muted:#9a9aa1; --faint:#636368; --hair:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(120,120,128,.4); --seg-on:#636366;
  --accent:#3ec488; --accent-ink:#03140c; --accent-soft:rgba(62,196,136,.14); --warn:#ffb15c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* chrome */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--hair);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.month{display:flex;align-items:center}
.month button{appearance:none;border:0;background:none;color:var(--accent);font-size:26px;line-height:1;padding:4px 10px 6px;cursor:pointer;border-radius:8px}
.month button:focus-visible{outline:2px solid var(--accent)}
.month-label{font-weight:600;font-size:17px;min-width:8.6em;text-align:center}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.sync[data-s="synced"]::before{background:var(--accent)}
.sync[data-s="error"]::before,.sync[data-s="auth"]::before,.sync[data-s="norepo"]::before{background:var(--warn)}
.sync .vn{color:var(--faint);font-variant-numeric:tabular-nums}
.top .sync{white-space:normal;text-align:right;min-width:0}
.top .month{flex:none}
button.sync{appearance:none;border:0;background:none;padding:6px 2px;cursor:pointer;font:inherit;font-size:13px}
button.sync:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.banner{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;border-radius:14px;padding:14px 16px;background:var(--accent-soft);color:var(--ink);font:inherit;width:100%}
.banner b{font-size:16px}
.banner span{font-size:14px;font-style:italic;color:var(--muted);line-height:1.35}
.banner.tap{cursor:pointer}
.banner.warn{background:rgba(180,83,10,.12)}
.row.link.danger{color:var(--warn)}
.ver{text-align:center;font-size:13px;color:var(--faint);margin:4px 0 0;font-variant-numeric:tabular-nums}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;font-weight:600;color:var(--faint);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg,.side-nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.view{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:6px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.large{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:10px;margin-bottom:-6px;text-wrap:balance}

/* cards and grouped lists */
.card{background:var(--card);border-radius:14px;padding:16px}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.g-title{font-size:13px;font-weight:400;color:var(--muted);margin:0 16px}
.g-foot{font-size:13px;font-style:italic;color:var(--muted);margin:0 16px;line-height:1.35}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 16px;position:relative}
.row + .row::before,.list > details + .row::before,.list > .row + details::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--hair)}
label.row{cursor:text}
label.row:has(.sw){cursor:pointer}
label.row:focus-within{background:var(--accent-soft)}
.lab{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.cap{font-size:13px;font-style:italic;color:var(--muted);line-height:1.3}
.v{flex:0 1 46%;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;font-variant-numeric:tabular-nums}
.vl{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;width:100%}
.unit{color:var(--muted);font-size:15px;flex:none}
.vsub{font-size:13px;color:var(--muted);font-style:italic}
.row.total{font-weight:600}
@media (max-width:520px){.row.oo{flex-wrap:wrap}.row.oo .lab{flex:1 0 100%}.row.oo .v{margin-left:auto}}
.row.total .unit{font-weight:400}
.row.link{color:var(--accent);cursor:pointer;justify-content:flex-start;appearance:none;border:0;background:none;width:100%;text-align:left;font-size:17px}
.row.link:hover{background:var(--accent-soft)}
input.val,input.txt,input.big,input.mini{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:var(--ink);min-width:0;width:100%;padding:0;margin:0;outline:none;border-radius:0}
input.val{text-align:right;font-variant-numeric:tabular-nums}
input.secret{-webkit-text-security:disc;font-family:var(--font)}
input.val:focus,input.mini:focus,input.big:focus{color:var(--accent)}
input::placeholder{color:var(--faint);opacity:1}
input.mini{display:inline-block;width:4.6em;font-style:normal;color:var(--ink);border-bottom:1px dashed var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.chip{appearance:none;border:0;background:var(--fill);color:var(--ink);font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;flex:none;min-width:50px}
.chip:focus-visible,.seg button:focus-visible,.stepper button:focus-visible,.row.link:focus-visible,.btn-plain:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill-strong);position:relative;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;flex:none}
.stepper button{appearance:none;border:0;background:none;width:40px;height:32px;font-size:20px;cursor:pointer;border-radius:9px}
.stepper b{min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.del{appearance:none;border:0;background:none;color:var(--faint);font-size:22px;line-height:1;padding:2px 2px 4px;cursor:pointer;flex:none}
.del:hover,.del:focus-visible{color:var(--warn)}
.btn-plain{appearance:none;border:0;background:var(--card);color:var(--accent);font-weight:600;border-radius:12px;padding:14px 16px;cursor:pointer;width:100%;font-size:17px}
textarea.copyout{width:100%;min-height:170px;font:13px/1.4 ui-monospace,Menlo,monospace;border:0;border-radius:12px;padding:12px;background:var(--card);color:var(--ink);margin-top:8px}

/* Today */
.hero-l{font-size:15px;color:var(--muted)}
.hero-in{display:flex;align-items:baseline;gap:8px;margin-top:2px}
input.big{font-family:var(--num);font-size:42px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;width:auto;max-width:78%}
input.big::placeholder{color:var(--ink)}
.done .sd,.done .parts{display:none}
.parts{grid-column:2 / -1;display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pr{display:flex;justify-content:space-between;gap:12px}
.pr span:first-child{min-width:0;overflow-wrap:anywhere}
.pr span:last-child{white-space:nowrap}
.pr.tot{border-top:.5px solid var(--hair);margin-top:3px;padding-top:4px;color:var(--ink);font-weight:600}
.sum{display:flex;flex-direction:column;margin-top:6px}
.sl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:.5px solid var(--hair);font-size:16px}
.sum > .sl:first-child{border-top:0}
.sl span{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl i{font-size:13px;color:var(--muted)}
.sl b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl.tot{font-weight:700;font-size:18px}
.sl.tot b{font-family:var(--num);font-size:22px;color:var(--accent)}
details.sd2 summary{list-style:none;cursor:pointer}
details.sd2 summary::-webkit-details-marker{display:none}
details.sd2 .sl{border-top:.5px solid var(--hair)}
details.sd2 .sl b::after{content:" ›";color:var(--faint)}
details.sd2[open] .sl b::after{content:" ⌄"}
.clist{padding:2px 0 10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cg{font-weight:600;color:var(--ink);margin:8px 0 2px;font-size:13px}
.ci{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.hero-in span{font-size:20px;color:var(--muted);font-weight:600}
.hero-sub{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.35}
.hero-sub i{display:block;font-size:13.5px}
.verdict{margin-top:10px;font-weight:600;font-size:15px;line-height:1.35}
.verdict.good{color:var(--accent)}
.verdict.over{color:var(--warn)}
.tips{margin-top:12px;border-top:.5px solid var(--hair);padding-top:10px}
.tips-h{font-size:13px;color:var(--muted);margin-bottom:4px}
.tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.4}
.recv{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--fill);cursor:text}
.recv > span:first-child{font-weight:600}
.recv .vl{width:auto;flex:0 1 50%}
.recv:focus-within{background:var(--accent-soft)}
.kpi{font-family:var(--num);font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;color:var(--muted)}
.goal-top b{font-family:var(--num);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-top small{font-size:14px;color:var(--muted);font-weight:500}
.track{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:10px 0 8px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--muted);margin:0 4px -10px}
.progress .track{flex:1;margin:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.steps label{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:0 12px;align-items:center;background:var(--card);border-radius:14px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
ol.steps input:not(.sent){position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.box{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:16px;font-family:var(--num)}
ol.steps input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:3px}
.st{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.sd{display:block;font-weight:400;font-style:italic;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.sa{font-family:var(--num);font-weight:700;font-size:17px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.next label{box-shadow:0 0 0 2px var(--accent)}
.pill{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;vertical-align:2px}
.done label,.skip label{background:transparent;box-shadow:0 0 0 1px var(--hair)}
.done .box{background:var(--accent);color:var(--accent-ink);font-size:19px}
.done .st,.done .sa{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
input.sent{appearance:none;-webkit-appearance:none;border:0;border-bottom:1px dashed var(--faint);border-radius:0;background:none;font:inherit;color:inherit;text-decoration:inherit;text-align:right;width:auto;max-width:6.5em;padding:6px 0;margin:-6px 0;outline:none}
.done input.sent:focus{color:var(--accent);text-decoration:none}
.skip label{cursor:default}
.skip .box{border-color:var(--faint);color:var(--faint)}
.skip .st,.skip .sa{color:var(--muted)}
.alldone{display:flex;gap:14px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;font-weight:700;font-size:18px}
.alldone b{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent-ink);color:var(--accent);font-size:22px}
.alldone span{display:block;font-weight:400;font-style:italic;font-size:14px;margin-top:2px}
details.more{background:var(--card);border-radius:12px}
details.more summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;color:var(--ink)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"›";color:var(--faint);font-size:20px;line-height:1;transform:rotate(90deg)}
details.more[open] summary::after{transform:rotate(-90deg)}
details.more ul{margin:0;padding:0 16px 12px;list-style:none;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

/* Budget + Grow */
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--fill);margin:14px 0 12px}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0}
.legend b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.acc{color:var(--accent)}
.lines{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:14px 0 6px}
.lines i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--font);font-size:19px;fill:var(--muted)}
table.plan{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums;font-size:15px}
table.plan th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:right;padding:10px 0 6px}
table.plan td{text-align:right;padding:9px 0;border-top:.5px solid var(--hair)}
table.plan th:first-child,table.plan td:first-child{text-align:left}
table.plan tr.now td{font-weight:700}
table.plan tr.hit td{color:var(--accent);font-weight:600}
.plan-card{background:var(--card);border-radius:12px;padding:0 16px 4px}
.plan-card details summary{list-style:none;color:var(--accent);padding:12px 0;cursor:pointer;border-top:.5px solid var(--hair)}
.plan-card details summary::-webkit-details-marker{display:none}

@media (prefers-reduced-motion:no-preference){
  .sw,.sw::after,.track i{transition:all .22s ease}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .justdone .box,.alldone b{animation:pop .35s ease}
}
@media (max-width:360px){ .month-label{min-width:7.4em;font-size:16px} .large{font-size:30px} input.big{font-size:36px} }

/* Mac: sidebar instead of tab bar */
@media (min-width:900px){
  .tabbar,.top{display:none}
  .side{display:flex;flex-direction:column;gap:18px;position:fixed;top:0;bottom:0;left:0;width:252px;padding:28px 14px 22px;background:var(--side);border-right:.5px solid var(--hair)}
  .main{margin-left:252px}
  .brand{font-weight:700;font-size:19px;padding:0 10px}
  .side .month{justify-content:space-between;background:var(--card);border-radius:10px;padding:2px}
  .side .month-label{min-width:0;font-size:15px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);text-align:left}
  .side-nav svg{width:22px;height:22px;color:var(--muted)}
  .side-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side-nav button[aria-current="page"] svg{color:var(--accent)}
  .side .sync{margin-top:auto;padding:0 10px}
  .view{padding-block:34px 70px}
  svg.chart text{font-size:14px}
}
</style>
</head>
<body>
<aside class="side" aria-label="Budget">
  <div class="brand">Budget + Savings</div>
  <div class="month" role="group" aria-label="Salary month">

<script>
(() => {
/* ---------- the budget, as in the workbook ---------- */
// An empty starting budget. Your real one is loaded from your private GitHub repo.
const DEFAULT_PLAN = {
  v: 1,
  salaryUsd: 0, usdPerAed: 0.2723, eurPerAed: 0.243, aedPerJpy: 0.024,
  text: {},
  fixed: [
    {id:'health',  name:'Health insurance', amt:0, cur:'AED', from:'NBD',  auto:true},
    {id:'billsa',  name:'Bills in EUR',             cur:'EUR', from:'ZABA', sum:'zg'},
    {id:'rentjp',  name:'Rent',             amt:0, cur:'JPY', from:'REVO'},
    {id:'billsb',  name:'Bills in JPY',             cur:'JPY', from:'REVO', sum:'jp', auto:true},
    {id:'subs',    name:'Subscriptions',            cur:'AED', from:'SPLIT', sum:'subs', auto:true},
    {id:'tickets', name:'Travel',           amt:0, cur:'AED', from:'REVO'},
    {id:'mortdxb', name:'Home loan',        amt:0, cur:'AED', from:'NBD'}
  ],
  zg: [], jp: [], dxb: {internet:0, service:0, dewa:0},
  subs: [], extras: [{id:'cc', name:'Credit card', amt:0, bank:'NBD'}],
  hsbcFee: 0, spendRevo: 0, spendWio: 0,
  wioSavings: 0, wioGoal: 30000, ibkrNow: 0,
  etf: {ret:7, years:10, bonus:0, cur:'EUR'},
  ratesAuto: true,
  saveRound: 100, saveRoundFrom: '2026-11',   // savings are rounded down to this; the rest is spending money in WIO
  partnerDirectFrom: '2026-11',   // from this month the partner's share goes straight from WIO; '' = through NBD
  ideas: {}
};
// Words that name people and places live in your data (plan.text), not in this public code.
const LABELS = {partner:'Partner', partnerNote:'', rentTo:'landlord', rentDue:'', billsA:'Bills in EUR', billsB:'Bills in JPY', home:'home', utility:'Utilities', subsNote:''};
const T = () => ({...LABELS, ...(S.plan.text || {})});

/* ---------- formatting (as you write it: 53.801 AED, 659,60 €) ---------- */
const nf0 = new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfr = new Intl.NumberFormat('de-DE',{maximumFractionDigits:5});
const r0 = n => nf0.format(Math.round(n) || 0);
const aed = n => r0(n) + ' AED';
const eur = n => nf2.format(n) + ' €';
const jpy = n => '¥' + nf0.format(n);
const usd = n => r0(n) + ' USD';
const short = v => v >= 1e6 ? (v/1e6).toLocaleString('de-DE',{maximumFractionDigits:2}) + ' M' : v >= 1e3 ? Math.round(v/1e3) + 'k' : String(Math.round(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((t,x) => t + (+x.amt || 0), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const addMonths = (key,k) => { const [y,m] = key.split('-').map(Number); const d = new Date(y, m-1+k, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const monthName = key => { const [y,m] = key.split('-').map(Number); return MONTHS[m-1] + ' ' + y; };
const shortDate = key => { const [y,m] = key.split('-').map(Number); return '26/' + m + '/' + String(y).slice(2); };

function parseNum(raw){
  // accepts 12.500 / 12,500 / 12500 / 412,75 / 0,25 / 0.25
  let s = String(raw).replace(/[^\d.,\-]/g,'');
  if (!s || s === '-') return null;
  const thousands = sep => { const g = s.split(sep); return g.length > 1 && g.slice(1).every(x => x.length === 3) && !/^-?0$/.test(g[0]) && g[0] !== ''; };
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if (hasDot && hasComma) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (hasComma) s = thousands(',') ? s.replace(/,/g,'') : s.replace(/,/g,'.');
  else if (hasDot && thousands('.')) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}

/* ---------- state ---------- */
const today = new Date();
const thisKey = (() => { const d = today.getDate() >= 15 ? today : new Date(today.getFullYear(), today.getMonth()-1, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
const S = { plan: clone(DEFAULT_PLAN), months: {}, key: thisKey, sync: 'local', copyText: '', view: 'today', fx: null };
try { S.fx = JSON.parse(localStorage.getItem('budget-fx') || 'null'); } catch(e) {}
try { const v = (location.hash || '').slice(1) || localStorage.getItem('budget-savings-view'); if (['today','month','budget','grow','sync'].includes(v)) S.view = v; } catch(e) {}

function mergePlan(stored){
  const p = clone(DEFAULT_PLAN);
  if (!stored || typeof stored !== 'object') return p;
  for (const k of Object.keys(stored)) {
    const v = stored[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && p[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) p[k] = {...p[k], ...clone(v)};
    else p[k] = clone(v);
  }
  return p;
}
try { const c = JSON.parse(localStorage.getItem('budget-savings-cache') || 'null'); if (c) { S.plan = mergePlan(c.plan); S.months = c.months || {}; } } catch(e) {}
function cache(){ try { localStorage.setItem('budget-savings-cache', JSON.stringify({plan:S.plan, months:S.months})); } catch(e) {} }

/* ---------- the arithmetic ---------- */
function compute(p, m, wioStart){
  m = m || {};
  const paid = m.paid || {}, ex = m.ex || {};
  const fxKeep = 1 - (+p.wioFxPct || 0) / 100;          // WIO's exchange cost, learned from the last salary you entered
  const income = p.salaryUsd / p.usdPerAed * fxKeep;    // the usual month, for the plan
  const salaryUsd = m.salaryUsd != null ? m.salaryUsd : p.salaryUsd;
  const midAed = salaryUsd / p.usdPerAed;               // at the market rate
  const incomeMonth = m.aedReceived != null ? +m.aedReceived : midAed * fxKeep;   // what lands in WIO: typed in, or estimated
  const fxLoss = midAed - incomeMonth;
  const zgEur = m.zgTotal != null ? +m.zgTotal : sum(p.zg), jpYen = m.jpTotal != null ? +m.jpTotal : sum(p.jp);   // this month's bill, or the usual
  const subsNbd = sum(p.subs.filter(s => s.bank === 'NBD')), subsRevo = sum(p.subs.filter(s => s.bank !== 'NBD'));
  const rows = p.fixed.map(f => {
    let orig = null, a;
    if (f.sum === 'zg') { orig = zgEur; a = zgEur / p.eurPerAed; }
    else if (f.sum === 'jp') { orig = jpYen; a = jpYen * p.aedPerJpy; }
    else if (f.sum === 'subs') { a = subsNbd + subsRevo; }
    else if (f.cur === 'JPY') { orig = +f.amt || 0; a = orig * p.aedPerJpy; }
    else if (f.cur === 'EUR') { orig = +f.amt || 0; a = orig / p.eurPerAed; }
    else a = +f.amt || 0;
    const eurOut = (f.from === 'ZABA' || f.eur) ? (f.cur === 'EUR' ? orig : a * p.eurPerAed) : null;
    return {...f, aed:a, orig, eurOut, paid:!!paid[f.id]};
  });
  const row = id => rows.find(r => r.id === id);
  const fixedTotal = rows.reduce((t,r) => t + r.aed, 0);
  const extras = p.extras.map(e => ({...e, plan:+e.amt || 0, now: ex[e.id] != null ? ex[e.id] : (+e.amt || 0)}));
  const extrasPlan = extras.reduce((t,e) => t + e.plan, 0);
  const remaining = income - fixedTotal - extrasPlan - p.hsbcFee;
  const living = p.spendRevo + p.spendWio;
  const saveRaw = remaining - living, save = roundDown(saveRaw, m.round), savePetty = saveRaw - save;

  // what has to go where this month
  const nbdParts = [], revoParts = [], zabaParts = [];
  let nbd = 0, revo = 0, zaba = 0;
  const direct = !!m.direct;
  const dewaDxb = m.dewaDxb != null ? m.dewaDxb : p.dxb.dewa;
  const label = {...LABELS, ...(p.text || {})};
  for (const r of rows) {
    if (r.paid) continue;
    if (r.id === 'mortdxb' && direct) {   // only the bills NBD pays; the partner's share leaves WIO on its own
      for (const [n, v] of [['Internet', p.dxb.internet], ['Service fee', p.dxb.service], [label.utility + ' ' + label.home, dewaDxb]]) { nbd += v; nbdParts.push([n, v]); }
    }
    else if (r.from === 'NBD') { nbd += r.aed; nbdParts.push([r.name, r.aed]); }
    else if (r.from === 'REVO') { revo += r.aed; revoParts.push([r.eur ? r.name + ' (sent on in EUR)' : r.name, r.aed]); }
    else if (r.from === 'ZABA') { revo += r.aed; zaba += r.eurOut; zabaParts.push([r.name, r.eurOut]); revoParts.push([r.name + ' (→ ZABA)', r.aed]); }
    else if (r.from === 'SPLIT') { if (subsNbd) { nbd += subsNbd; nbdParts.push(['Subscriptions', subsNbd]); } if (subsRevo) { revo += subsRevo; revoParts.push(['Subscriptions', subsRevo]); } }
  }
  let wioOut = 0;
  const wioParts = [];
  for (const e of extras) {
    if (!e.now) continue;
    if (e.bank === 'NBD') { nbd += e.now; nbdParts.push([e.name, e.now]); }
    else if (e.bank === 'REVO') { revo += e.now; revoParts.push([e.name, e.now]); }
    else { wioOut += e.now; wioParts.push([e.name, e.now]); }
  }
  // one-offs typed in for this month only
  const oneoffs = (m.oneoffs || []).filter(o => +o.amt);
  let wioOneoffs = 0;
  for (const o of oneoffs) {
    const v = +o.amt, nm = o.name || 'One-off';
    if (o.bank === 'NBD') { nbd += v; nbdParts.push([nm, v]); }
    else if (o.bank === 'REVO') { revo += v; revoParts.push([nm, v]); }
    else { wioOut += v; wioOneoffs += v; wioParts.push([nm, v]); }
  }
  // a bigger service-fee bill than usual at home: the extra comes from salary, the partner's share stays the same
  const serviceDxb = m.serviceDxb != null ? m.serviceDxb : p.dxb.service;
  const mortRow = row('mortdxb');
  const serviceExtra = mortRow && !mortRow.paid ? serviceDxb - p.dxb.service : 0;
  if (serviceExtra) { nbd += serviceExtra; nbdParts.push(['Service fee extra', serviceExtra]); }
  // the partner's share of the home loan: what is left after the bills
  const mort = row('mortdxb');
  let toPartner = mort && !mort.paid ? mort.aed - p.dxb.internet - p.dxb.service - dewaDxb : 0;
  let partnerPaid = 0, partnerLeft = 0, sentPartner = null;
  if (direct && mort && !mort.paid) {
    toPartner = Math.max(0, Math.round(toPartner));
    sentPartner = (m.done || {}).toPartner && (m.sent || {}).partner != null ? +m.sent.partner : null;
    partnerLeft = sentPartner != null ? sentPartner - toPartner : 0;
    partnerPaid = Math.max(toPartner, sentPartner || 0);
    wioOut += partnerPaid; wioParts.push([`${label.partner} (${mort.name})`, partnerPaid]);
  }
  const costsDue = nbd + revo + wioOut;   // everything to pay this month, before spending money
  const costParts = {NBD:nbdParts.slice(), Revo:revoParts.slice(), WIO:wioParts};
  revo += p.spendRevo; revoParts.push(['Spending money for the month', p.spendRevo]);
  const extraNbd = +m.extraNbd || 0, extraRevo = +m.extraRevo || 0;
  const nbdNeed = nbd - extraNbd, revoNeed = revo - extraRevo;
  const nbdSend = nbdNeed > 0 ? Math.ceil(nbdNeed) : 0;
  const hsbcSend = revoNeed > 0 ? Math.ceil(revoNeed + p.hsbcFee) : 0;

  const start = wioStart != null ? wioStart : p.wioSavings;
  let wioAfter = start + incomeMonth - nbdSend - hsbcSend - wioOut;
  let wioSav = wioAfter - p.spendWio;
  // savings over the WIO goal ride along to Revo for IBKR
  let toIbkr = 0, hsbcTotal = hsbcSend;
  if (wioSav > p.wioGoal) {
    toIbkr = roundDown(Math.floor(wioSav - p.wioGoal), m.round);
    hsbcTotal = hsbcSend > 0 ? hsbcSend + toIbkr : Math.ceil(toIbkr + p.hsbcFee);
    if (hsbcSend === 0 && toIbkr === 0) hsbcTotal = 0;
    wioAfter -= (hsbcTotal - hsbcSend); wioSav = wioAfter - p.spendWio;
  }
  // Amounts already sent (kept when you tick the step). A cost that changes afterwards leaves money over, or short.
  const ticked = m.done || {}, sentAll = m.sent || {};
  const sent = {nbd:ticked.nbd ? sentAll.nbd : null, hsbc:ticked.hsbc ? sentAll.hsbc : null, ibkr:ticked.ibkr ? sentAll.ibkr : null};
  // Once the savings are in Revo (or already at IBKR) they no longer follow the WIO side:
  // a later cost in WIO or NBD comes out of the WIO savings, a later cost in Revo out of what is still in Revo.
  if (sent.ibkr != null || sent.hsbc != null) {
    const base = hsbcSend > 0 ? hsbcSend : Math.ceil(p.hsbcFee);       // what Revo needs before any savings
    const planned = m.ibkrPlan != null ? +m.ibkrPlan : toIbkr;
    const fixed = sent.ibkr != null ? Math.max(0, +sent.ibkr) : planned > 0 ? Math.max(0, roundDown(Math.floor(+sent.hsbc - base), m.round)) : 0;
    const total = fixed > 0 ? base + fixed : hsbcSend;
    wioAfter -= total - hsbcTotal; wioSav = wioAfter - p.spendWio;
    toIbkr = fixed; hsbcTotal = total;
  }
  const nbdLeft = sent.nbd != null ? +sent.nbd - nbdSend : 0;
  const hsbcLeft = sent.hsbc != null ? +sent.hsbc - hsbcTotal : 0;
  const leftOver = Math.max(0, nbdLeft) + Math.max(0, hsbcLeft);   // left WIO, sits in NBD / Revo
  wioAfter -= leftOver; wioSav = wioAfter - p.spendWio;
  const petty = wioSav - roundDown(wioSav, m.round);     // rounded off the savings: extra spending money in WIO
  wioSav -= petty;
  const saveThis = wioSav - start + toIbkr;
  return {income, rows, row, fixedTotal, extras, extrasPlan, remaining, living, save, subsNbd, subsRevo, zgEur, jpYen,
    nbdParts, revoParts, zabaParts, nbdNeed, revoNeed, nbdSend, hsbcSend, hsbcTotal, zaba, toPartner, dewaDxb,
    extraNbd, extraRevo, start, wioAfter, wioSav, toIbkr, saveThis, wioOut, paid, oneoffs, wioOneoffs, serviceDxb, serviceExtra, nbdLeft, hsbcLeft, leftOver, petty, saveRaw, savePetty, round:m.round, direct, partnerPaid, partnerLeft, sentPartner, dewaTyped:m.dewaDxb != null, sentNbd:sent.nbd, sentHsbc:sent.hsbc, salaryUsd, incomeMonth, midAed, fxLoss, received:m.aedReceived != null, costsDue, costParts,
    paidRows:rows.filter(r => r.paid), paidBefore:rows.filter(r => r.paid).reduce((t,r) => t + r.aed, 0)};
}

// WIO savings at the start of a month: typed in, or carried on from earlier months
const memo = {w:new Map(), m:new Map()};
const resetMemo = () => { memo.w.clear(); memo.m.clear(); };
// Money left over last month (sent but not needed) is already sitting in NBD / Revo this month
function carryIn(key){
  const prev = addMonths(key, -1);
  if (!S.months[prev]) return {nbd:0, revo:0, from:prev};
  const R = compute(planFor(prev), monthIn(prev), wioStart(prev));
  return {nbd:Math.max(0, Math.round(R.nbdLeft)), revo:Math.max(0, Math.round(R.hsbcLeft)), from:prev};
}
// A month as typed, with last month's left-overs filled in where you typed nothing
function monthIn(key){
  if (memo.m.has(key)) return memo.m.get(key);
  const m = S.months[key] || {}, c = carryIn(key);
  const out = {...m, extraNbd:m.extraNbd != null ? m.extraNbd : (c.nbd || undefined), extraRevo:m.extraRevo != null ? m.extraRevo : (c.revo || undefined), carried:c,
    direct:(from => !!from && key >= from)(m.frozen ? m.frozen.partnerDirectFrom : S.plan.partnerDirectFrom),
    round:(q => q.saveRoundFrom && key >= q.saveRoundFrom ? +q.saveRound || 0 : 0)(planFor(key))};
  memo.m.set(key, out); return out;
}
function wioStart(key, depth = 0){
  if (memo.w.has(key)) return memo.w.get(key);
  const v = wioStartRaw(key, depth); memo.w.set(key, v); return v;
}
function wioStartRaw(key, depth){
  const m = S.months[key];
  if (m && m.wioNow != null) return m.wioNow;
  if (depth > 24) return S.plan.wioSavings;
  let back = null;
  for (let k = 1; k <= 24 - depth; k++) { if (S.months[addMonths(key,-k)]) { back = k; break; } }
  if (back == null) return S.plan.wioSavings;
  const prev = addMonths(key, -1);
  const q = planFor(prev);
  return Math.min(compute(q, monthIn(prev), wioStart(prev, depth + 1)).wioSav, q.wioGoal);
}

function ideasList(p){
  const L = [{id:'living', name:'Living spend (REVO + WIO)', now:p.spendRevo + p.spendWio}];
  const cc = p.extras.find(e => e.id === 'cc'); if (cc) L.push({id:'cc', name:'Credit card', now:+cc.amt || 0});
  const t = p.fixed.find(f => f.id === 'tickets'); if (t) L.push({id:'tickets', name:t.name, now:+t.amt || 0});
  L.push({id:'hsbc', name:'HSBC hop fee', now:p.hsbcFee});
  p.subs.forEach(s => { if (+s.amt > 0) L.push({id:'sub:' + s.id, name:s.name, now:+s.amt, sub:true}); });
  return L.map(x => { const st = p.ideas[x.id] || {}; const target = st.target != null ? st.target : (x.sub ? 0 : x.now);
    return {...x, target, on:!!st.on, saves:Math.max(0, x.now - target)}; });
}

const roundDown = (v, q) => q > 0 && v > 0 ? Math.floor((v + 1e-6) / q) * q : v;
const usual = p => ({round:+p.saveRound || 0});   // a normal month, with the rounding
const mRate = p => Math.pow(1 + p.etf.ret/100, 1/12) - 1;

/* ---------- exchange rates: fetched once a day on each device, your typed ones as the fallback ---------- */
const rateOf = (p, c) => c === 'EUR' ? p.eurPerAed : c === 'USD' ? p.usdPerAed : 1;
// IBKR balance as you typed it, in its own currency, so a new rate never changes the number you entered
const holding = p => p.ibkrHold || {amt:(+p.ibkrNow || 0) * rateOf(p, p.etf.cur || 'AED'), cur:p.etf.cur || 'AED'};
const liveRates = () => S.plan.ratesAuto !== false && S.fx ? S.fx : null;
// The plan every sum works from: today's rates in, IBKR balance turned into AED with them
function effPlan(){
  const fx = liveRates();
  const e = fx ? {...S.plan, usdPerAed:fx.usdPerAed, eurPerAed:fx.eurPerAed, aedPerJpy:fx.aedPerJpy} : {...S.plan};
  const h = holding(S.plan);
  e.ibkrNow = (+h.amt || 0) / rateOf(e, h.cur);
  return e;
}
/* ---------- past months keep the amounts and rates they had ---------- */
const RATES = ['usdPerAed', 'eurPerAed', 'aedPerJpy'];
const FROZEN = ['salaryUsd', ...RATES, 'fixed', 'zg', 'jp', 'dxb', 'subs', 'extras', 'hsbcFee', 'spendRevo', 'spendWio', 'wioGoal', 'wioFxPct', 'saveRound', 'saveRoundFrom', 'partnerDirectFrom', 'places'];
const pick = (o, ks) => clone(Object.fromEntries(ks.filter(k => o[k] !== undefined).map(k => [k, o[k]])));
const currentKey = () => { const t = new Date(), d = t.getDate() >= 15 ? t : new Date(t.getFullYear(), t.getMonth() - 1, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
// The plan a month is worked out from: frozen when it is over; the rates of its transfer day once transfers have begun
function planFor(key){
  const m = S.months[key] || {}, e = effPlan();
  return m.frozen ? {...e, ...m.frozen} : m.rates ? {...e, ...m.rates} : e;
}
// Called before the plan changes and when a new month has begun
function freezePast(){
  const now = currentKey(); let changed = false;
  for (const k of Object.keys(S.months)) if (k < now && !S.months[k].frozen) { S.months[k].frozen = pick(planFor(k), FROZEN); changed = true; }
  if (changed) resetMemo();
  return changed;
}
const settlePast = () => { if (freezePast()) { cache(); queueSave(); render(); } };
const sane = r => r.usdPerAed > 0.25 && r.usdPerAed < 0.3 && r.eurPerAed > 0.15 && r.eurPerAed < 0.4 && r.aedPerJpy > 0.01 && r.aedPerJpy < 0.05;
async function refreshRates(force){
  const today = new Date().toISOString().slice(0, 10);
  if (!force && S.fx && S.fx.fetched === today) return;
  if (!navigator.onLine) return;
  for (const url of ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/aed.min.json', 'https://latest.currency-api.pages.dev/v1/currencies/aed.min.json']) {
    try {
      const r = await fetch(url, {cache:'no-store'}); if (!r.ok) continue;
      const j = await r.json(), a = j.aed || {};
      const next = {fetched:today, date:j.date, usdPerAed:a.usd, eurPerAed:a.eur, aedPerJpy:1 / a.jpy};
      if (!sane(next)) continue;          // a broken feed never reaches your sums
      S.fx = next; try { localStorage.setItem('budget-fx', JSON.stringify(next)); } catch(e) {}
      render(); return;
    } catch(e) {}
  }
}
// IBKR figures in the currency the account is in; everything is worked out in AED underneath
function etfMoney(p){
  const c = p.etf.cur || 'AED';
  const r = c === 'EUR' ? p.eurPerAed : c === 'USD' ? p.usdPerAed : 1;
  const sym = c === 'EUR' ? ' €' : ' ' + c;
  return {c, r, sym, f:n => r0(n * r) + sym, s:n => short(n * r)};
}
const fv = (m, n, i) => i ? m * (Math.pow(1+i, n) - 1) / i : m * n;

function project(p, key, R, extra, months){
  const i = mRate(p), N = compute(p, {}, 0);   // rounded below, together with ideas and bonus
  let wio = R.wioSav, ibkr = (+p.ibkrNow || 0) + R.toIbkr, put = ibkr;
  const rows = [{key, saved:R.saveThis, wio, to:R.toIbkr, ibkr, put}];
  for (let k = 1; k <= months; k++) {
    const mk = addMonths(key, k);
    const bonus = mk.endsWith('-07') ? (+p.etf.bonus || 0) / p.usdPerAed : 0;   // typed in USD
    const s = roundDown(N.save + extra + bonus, +p.saveRound || 0);
    ibkr *= (1 + i);
    let to = 0;
    if (s < 0) wio += s;
    else { const toW = Math.max(0, Math.min(s, p.wioGoal - wio)); wio += toW; to = s - toW; }
    ibkr += to; put += to;
    rows.push({key:mk, saved:s, wio, to, ibkr, put, bonus});
  }
  return rows;
}

// Salary in, costs out, living money set aside: what is left is this month's saving.
function monthCard(p, R){
  const living = p.spendRevo + p.spendWio, already = R.extraNbd + R.extraRevo;
  const feeEtc = R.incomeMonth - R.costsDue - living - R.petty + already - R.leftOver - R.saveThis;
  const N = compute(p, {round:R.round}, 0);
  const line = (label, v, cap, cls) => `<div class="sl ${cls || ''}"><span>${label}${cap ? `<i>${cap}</i>` : ''}</span><b>${v}</b></div>`;
  const costList = Object.entries(R.costParts).filter(([, l]) => l.length).map(([bank, l]) =>
    `<div class="cg">From ${bank}</div>` + l.map(([n, v]) => `<div class="ci"><span>${esc(n)}</span><span>${r0(v)}</span></div>`).join('')).join('');
  const why = [];
  for (const r of R.paidRows) why.push(`+${r0(r.aed)} ${esc(r.name)} paid before salary`);
  if (already) why.push(`+${r0(already)} already in Revo and NBD`);
  const salaryDiff = R.incomeMonth - R.income; if (Math.abs(salaryDiff) >= 1) why.push(`${salaryDiff > 0 ? '+' : '−'}${r0(Math.abs(salaryDiff))} salary`);
  if (R.leftOver >= 1) why.push(`−${r0(R.leftOver)} left over in NBD/Revo for next month`);
  const kept = R.petty - R.savePetty; if (Math.abs(kept) >= 1) why.push(`${kept > 0 ? '−' : '+'}${r0(Math.abs(kept))} rounding`);
  const other = R.saveThis - R.save - R.paidBefore - already - salaryDiff + R.leftOver + kept;
  if (Math.abs(other) >= 1) why.push(`${other > 0 ? '+' : '−'}${r0(Math.abs(other))} bills ${other > 0 ? 'lower' : 'higher'} than usual`);

  <div class="card">
    <div class="hero-l">This month</div>
    <div class="sum">
      ${line('Salary', '+' + r0(R.incomeMonth), R.fxLoss >= 0.5 ? `${usd(R.salaryUsd)} · ${r0(R.fxLoss)} ${R.received ? 'lost' : 'expected'} to the exchange` : '')}
      <details class="sd2"><summary>${line('Costs due this month', '−' + r0(R.costsDue), 'Tap to see them all' + (R.paidRows.length ? ` · ${R.paidRows.map(r => esc(r.name)).join(', ')} already paid` : ''))}</summary><div class="clist">${costList}</div></details>

      ${Math.abs(feeEtc) >= 0.5 ? line('HSBC fee and rounding', (feeEtc > 0 ? '−' : '+') + r0(Math.abs(feeEtc))) : ''}

      ${line('Saved this month', aed(R.saveThis), '', 'tot')}
    </div>
    <p class="cap">A normal month saves ${aed(N.save)}.${why.length ? ' This month: ' + why.join(' · ') + '.' : ''}</p>
  </div>`;
}

// How last month went: the balances you typed before this salary against what the plan expected.
// Money still in WIO above the plan's savings, or still in Revo, is living money you didn't spend.
function reviewPrev(p, key){
  const prevKey = addMonths(key, -1);
  if (!S.months[prevKey]) return null;
  const m = S.months[key] || {};
  const q = planFor(prevKey), P = compute(q, monthIn(prevKey), wioStart(prevKey));
  const r = {prevKey, plannedSave:P.saveThis, spendWio:q.spendWio + P.petty, spendRevo:q.spendRevo};
  if (m.wioNow == null) return {...r, waiting:true};
  const c = carryIn(key);
  r.ibkr = +m.ibkrSent || 0;
  // what you sent to IBKR includes the payday transfer, which the plan already took out of WIO
  const more = r.ibkr ? Math.max(0, r.ibkr - P.toIbkr) : 0, less = r.ibkr ? Math.max(0, P.toIbkr - r.ibkr) : 0;
  r.wioExtra = m.wioNow + more - P.wioSav;          // above the plan's savings = WIO living money not spent
  r.wioSpent = r.spendWio - r.wioExtra;
  if (m.extraRevo != null) { r.revoLeft = m.extraRevo - c.revo - less; r.revoSpent = q.spendRevo - r.revoLeft; }
  if (m.extraNbd != null) r.nbdLeft = m.extraNbd - c.nbd;   // bills money not used
  r.saved = P.saveThis + r.wioExtra + (r.revoLeft || 0) + (r.nbdLeft || 0);
  return r;
}
// Plain-arithmetic tips from your own numbers, most valuable first
function tipsFor(p, r, key){
  const tips = [], i = mRate(p), M = etfMoney(p), yrs = p.etf.years;
  const later = m => `about ${M.f(fv(m, yrs * 12, i))} in IBKR after ${yrs} years`;
  const living = p.spendWio + p.spendRevo, hist = [];
  for (let k = 0; k < 12; k++) { const x = reviewPrev(p, addMonths(key, -k)); if (x && !x.waiting && x.revoSpent != null) hist.push(Math.max(0, x.wioSpent) + Math.max(0, x.revoSpent)); }
  if (hist.length) {
    const avg = hist.reduce((a, b) => a + b, 0) / hist.length, target = Math.ceil(avg / 500) * 500, over = avg - living;
    const span = hist.length > 1 ? ` on average over ${hist.length} months` : '';
    if (living - target >= 500) tips.push(`You used about ${aed(avg)} of your ${r0(living)} living money${span}. Setting it to ${r0(target)} (Budget → Spending money) moves ${r0(living - target)} a month to savings: ${aed((living - target) * 12)} a year, ${later(living - target)}.`);
    else if (over >= 300) tips.push(`Living costs ran about ${aed(over)} over the ${r0(living)} you set aside${span}, mostly from ${r.wioSpent - p.spendWio >= (r.revoSpent || 0) - p.spendRevo ? 'WIO' : 'Revo'}. Either raise it so the plan matches real life, or cut back there first.`);
  }
  const months = Object.keys(S.months).sort().filter(k => k <= addMonths(key, -1)).slice(-6);
  const oneoffs = months.map(k => (S.months[k].oneoffs || []).reduce((t, o) => t + (+o.amt || 0), 0));
  const ooAvg = oneoffs.reduce((a, b) => a + b, 0) / (oneoffs.length || 1), last = oneoffs[oneoffs.length - 1] || 0;
  if (last >= 500) tips.push(months.filter(k => (S.months[k].oneoffs || []).length).length > 1
    ? `${aed(last)} went on unexpected costs last month, about ${aed(ooAvg)} a month lately. Planning about ${r0(Math.ceil(ooAvg / 100) * 100)} a month for surprises keeps savings from dipping.`
    : `${aed(last)} went on unexpected costs last month. If costs like these come often, the recap will suggest a monthly amount to set aside once there are a few months to compare.`);
  const subs = p.subs.filter(x => +x.amt > 0).sort((a, b) => b.amt - a.amt), st = subs.reduce((t, x) => t + +x.amt, 0);
  if (st >= 300) tips.push(`Subscriptions cost ${aed(st)} a month, ${aed(st * 12)} a year. Biggest: ${subs.slice(0, 3).map(x => `${esc(x.name)} ${r0(x.amt)}`).join(', ')}. Grow → Possible savings shows what dropping each is worth.`);
  const fx = (+p.wioFxPct || 0) / 100 * p.salaryUsd / p.usdPerAed, fees = (p.hsbcFee + fx) * 12;
  if (fees >= 500) tips.push(`Transfer and exchange costs come to about ${aed(fees)} a year (HSBC ${r0(p.hsbcFee)} and WIO’s exchange ${r0(fx)} a month). A direct WIO → Revo route would save the HSBC part.`);
  return tips.slice(0, 4);
}
function reviewCard(p, key){
  const r = reviewPrev(p, key);
  if (!r) return '';
  const name = MONTHS[+r.prevKey.slice(5) - 1];
  if (r.waiting) return `<button type="button" class="banner tap" data-view="month"><b>How did ${name} go?</b><span>Just before this salary, type what’s left in WIO, Revo and NBD, and anything you sent to IBKR, in Month. You’ll get a short recap and tips.</span></button>`;
  const line = (label, v, cap, cls) => `<div class="sl ${cls || ''}"><span>${label}${cap ? `<i>${cap}</i>` : ''}</span><b>${v}</b></div>`;
  const spent = (v, budget) => v < 0 ? `none of ${r0(budget)}` : `${r0(v)} of ${r0(budget)}`;
  const known = r.revoSpent != null;
  const budget = r.spendWio + (known ? r.spendRevo : 0);
  const used = Math.max(0, r.wioSpent) + (known ? Math.max(0, r.revoSpent) : 0);
  const d = budget - used;
  const verdict = Math.abs(d) < 50 ? ['ok', `Right on plan: you spent about what you set aside${known ? '' : ' in WIO'}.`]
    : d > 0 ? ['good', `You spent about ${aed(d)} less than planned${known ? '' : ' from WIO'}. That’s extra savings.`]
    : ['over', `You spent about ${aed(-d)} more than planned${known ? '' : ' from WIO'}. It came out of your savings.`];
  const tips = tipsFor(p, r, key);
  return `
  <div class="card">
    <div class="hero-l">How ${name} went</div>
    <div class="sum">
      ${line('WIO living money spent', spent(r.wioSpent, r.spendWio), r.wioSpent < 0 ? `${aed(-r.wioSpent)} more in WIO than expected. Did money come in from elsewhere?` : '')}
      ${line('Revo living money spent', known ? spent(r.revoSpent, r.spendRevo) : '–', known ? `${aed(Math.max(0, r.revoLeft))} still in Revo` : 'Type what’s left in Revo in Month to see this')}
      ${r.nbdLeft != null ? line('Bills money left in NBD', r0(Math.max(0, r.nbdLeft)), r.nbdLeft >= 1 ? 'Bills came in lower than planned; it’s used for this month’s bills' : r.nbdLeft <= -1 ? `${aed(-r.nbdLeft)} less than expected: a bill was higher, or NBD paid something else` : 'Exactly as planned') : ''}
      ${r.ibkr ? line('Sent to IBKR', '+' + r0(r.ibkr), 'Saved, not spent. Update the balance in Grow') : ''}
      ${line(`Saved in ${name}`, '≈ ' + aed(r.saved), `The plan said ${aed(r.plannedSave)}`, 'tot')}
    </div>
    <p class="verdict ${verdict[0]}">${verdict[1]}</p>
    ${tips.length ? `<div class="tips"><div class="tips-h">Tips</div><ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
  </div>`;
}

/* ---------- Month: what changed before salary ---------- */
function viewMonth(p, R, key){
  const m = S.months[key] || {}, t = T(), carry = carryIn(key);
  const mortAmt = (R.row('mortdxb') || {}).aed || 0;
  const cc = p.extras.find(e => e.id === 'cc');
  const before = [
    row('Left in WIO right now', num('m.wioNow', m.wioNow, {empty:true, ph:r0(R.start), label:'Left in WIO right now'}), {tag:'label', unit:'AED', cap:'Everything in WIO before this salary'}),
    row('Left in Revo right now', num('m.extraRevo', m.extraRevo, {empty:true, ph:r0(carry.revo), label:'Left in Revo right now'}), {tag:'label', unit:'AED', cap:carry.revo && m.extraRevo == null ? `${r0(carry.revo)} left over from ${monthName(carry.from)}'s transfer` : 'Used first for this month, so less is sent'}),
    row('Left in NBD right now', num('m.extraNbd', m.extraNbd, {empty:true, ph:r0(carry.nbd), label:'Left in NBD right now'}), {tag:'label', unit:'AED', cap:carry.nbd && m.extraNbd == null ? `${r0(carry.nbd)} left over from ${monthName(carry.from)}'s transfer` : 'Used first for this month, so less is sent'}),
    row('Sent to IBKR since last salary', num('m.ibkrSent', m.ibkrSent, {empty:true, ph:'0', label:'Sent to IBKR since last salary'}), {tag:'label', unit:'AED', cap:'Everything, the payday transfer included. Counted as saved'})
  ].join('');
  // one row per bill: this month's amount where it changes, a switch where it may already be paid
  const billRow = r => {
    if (r.sum === 'zg') return row(esc(r.name), num('m.zgTotal', m.zgTotal, {d2:true, empty:true, ph:nf2.format(sum(p.zg)), label:r.name + ' this month, euro'}), {tag:'label', unit:'€', cap:`Usually ${nf2.format(sum(p.zg))} € · ≈ ${aed(r.aed)} this month`});
    if (r.sum === 'jp') return row(esc(r.name), num('m.jpTotal', m.jpTotal, {empty:true, ph:nf0.format(sum(p.jp)), label:r.name + ' this month, yen'}), {tag:'label', unit:'¥', cap:`Usually ${nf0.format(sum(p.jp))} ¥ · ≈ ${aed(r.aed)} this month`});
    if (r.sum === 'subs') return row(esc(r.name), r0(r.aed), {unit:'AED', cap:fromText(r)});
    const amt = r.cur === 'JPY' ? jpy(r.orig) : r.cur === 'EUR' ? eur(r.orig) : aed(r.aed) + (r.eurOut != null ? ` (≈ ${eur(r.eurOut)})` : '');
    if (r.auto) return row(esc(r.name), r0(r.aed), {unit:'AED', cap:fromText(r)});
    return row(esc(r.name), null, {tag:'label', cap:`${amt} · ${r.id === 'mortdxb' && R.direct ? esc(`bills on NBD, the rest from WIO to ${t.partner}`) : fromText(r)}${r.paid ? ' · paid before salary' : ''}`, end:sw('m.paid.' + r.id, r.paid, 'Already paid: ' + r.name)});
  };
  const homeRows = row(esc(t.utility), num('m.dewaDxb', m.dewaDxb, {empty:true, ph:r0(p.dxb.dewa), label:t.utility + ' this month'}), {tag:'label', unit:'AED', cap:esc(`Paid from the ${r0(mortAmt)}; changes what ${t.partner} gets`)})
    + row('Service fee', num('m.serviceDxb', m.serviceDxb, {empty:true, ph:r0(p.dxb.service), label:'Service fee this month'}), {tag:'label', unit:'AED',
        cap: R.serviceExtra > 0 ? `${aed(R.serviceExtra)} over the usual ${r0(p.dxb.service)} comes from this salary` : `Usually ${r0(p.dxb.service)}`});
  const ccRow = cc ? row('Credit card bill', num('m.ex.cc', (m.ex || {}).cc, {empty:true, ph:r0(cc.amt), label:'Credit card this month'}), {tag:'label', unit:'AED', cap:'From NBD'}) : '';
  // bills grouped by place: home first, then your other places, then the rest
  const all = S.plan.places || [], places = [...all.filter(x => x === t.home), ...all.filter(x => x !== t.home)], groups = new Map(places.map(pl => [pl, []]));
  for (const r of R.rows) { const pl = r.place && groups.has(r.place) ? r.place : ''; if (!groups.has(pl)) groups.set(pl, []); groups.get(pl).push(r); }
  let bills = '', ccDone = false, first = true;
  for (const [pl, rows] of groups) {
    if (!rows.length) continue;
    let inner = '';
    for (const r of rows) { if (r.id === 'mortdxb') inner += homeRows; inner += billRow(r); }
    if (!pl && ccRow) { inner += ccRow; ccDone = true; }
    bills += group(pl ? esc(pl) : (places.length ? 'Other' : 'Bills this month'), inner, first ? 'Switch on what you already paid before salary. Leave a box empty for the usual amount, shown in grey.' : '');
    first = false;
  }
  if (!ccDone && ccRow) bills += group('Other', ccRow);
  const oo = (m.oneoffs || []).map((o,i) => row(txt(`m.oneoffs.${i}.name`, o.name, {ph:'What was it?', label:'Unexpected cost'}),
      num(`m.oneoffs.${i}.amt`, o.amt, {label:'Amount in AED'}), {unit:'AED', cls:'oo', end:chip(`m.oneoffs.${i}.bank`, o.bank) + del('del-oneoff', i, o.name || 'cost')})).join('');
  return `
  ${group('Before salary', before, 'Type these just before salary day: they set this month’s transfers and show how last month went on Today.')}
  ${group('Unexpected costs', oo + link('add-oneoff', 'Add an unexpected cost'), 'A repair, a gift or a fine. Tap the bank to switch between NBD, Revo and WIO; that transfer grows by the amount.')}
  ${bills}
  ${group('Note', row(txt('m.note', m.note, {ph:'What you did before salary', label:'Note for this month'}), null, {tag:'label'}))}`;
}

    else if (r.sum === 'jp') { val = nf0.format(r.orig); unit = '¥'; sub = `≈ ${aed(r.aed)} · ${esc(t.billsB)} below`; }

  ${group('Fixed costs', fixed)}

function heldIn(p, c){ const h = holding(S.plan); return h.cur === c ? +h.amt || 0 : (+h.amt || 0) / rateOf(p, h.cur) * rateOf(p, c); }
function ratesGroup(p){
  const auto = S.plan.ratesAuto !== false, fx = S.fx;
  const sw4 = row('Update every day', null, {tag:'label', cap:auto ? (fx ? `Rates of ${new Date(fx.date + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'})}, checked ${fx.fetched === new Date().toISOString().slice(0,10) ? 'today' : 'on ' + fx.fetched}` : 'Waiting for the first update; your typed rates are used') : 'Off: your typed rates are used', end:sw('p.ratesAuto', auto, 'Update exchange rates every day')});
  const show = (label, k, v) => auto && fx ? row(label, nfr.format(v)) : row(label, num('p.' + k, S.plan[k], {dec:true, label}), {tag:'label'});
  return group('Exchange rates', sw4 + show('1 AED in USD', 'usdPerAed', p.usdPerAed) + show('1 AED in EUR', 'eurPerAed', p.eurPerAed) + show('1 yen in AED', 'aedPerJpy', p.aedPerJpy),
    auto ? 'Fetched once a day on this device. Your typed rates are kept as the backup for when there is no connection.' : 'Switch on to fetch rates once a day.');
}

/* ---------- Grow: possible savings, ETF, savings plan ---------- */
function viewGrow(p, R, key){
  const M = etfMoney(p), i = mRate(p), n = p.etf.years * 12;
  const L = ideasList(p), extra = L.filter(x => x.on).reduce((t,x) => t + x.saves, 0);
  const A = project(p, key, R, 0, n), B = project(p, key, R, extra, n);
  const endA = A[A.length-1], endB = B[B.length-1];
  const hit = A.find(r => r.wio >= p.wioGoal - 0.5);
  const marks = [1,3,5,10,15,20,25,30].filter(y => y <= p.etf.years);
  if (!marks.includes(p.etf.years)) marks.push(p.etf.years);
  const second = v => M.c === 'AED' ? usd(v * p.usdPerAed) : aed(v);
  const unitC = M.c === 'EUR' ? '€' : M.c;
  const ideas = L.map(x => row(esc(x.name), x.saves ? `−${r0(x.saves)}` : '–', {unit:x.saves ? '/mo' : '',
      cap:`Now ${r0(x.now)} → ${num('p.ideas.' + x.id + '.target', x.target, {cls:'mini', label:'Target for ' + x.name})}${x.sub ? ' (cancel)' : ''}`,
      end:sw(`p.ideas.${x.id}.on`, x.on, 'Count ' + x.name)})).join('');
  const plan = project(p, key, R, 0, 24);
  const hitIdx = plan.findIndex(r => r.wio >= p.wioGoal - 0.5);
  const tr = (r,k) => `<tr class="${k === 0 ? 'now' : ''}${k === hitIdx && k ? ' hit' : ''}"><td>${MONTHS[+r.key.slice(5) - 1].slice(0,3)} ${r.key.slice(2,4)}${r.bonus ? ' +bonus' : ''}</td><td>${r0(r.saved)}</td><td>${r0(r.wio)}</td><td>${r.ibkr ? r0(r.ibkr * M.r) : '–'}</td></tr>`;
  const head = `<colgroup><col style="width:28%"><col><col><col></colgroup>`;
  return `
  <div class="card">
    <div class="hero-l">IBKR in ${p.etf.years} years</div>
    <div class="kpi">${M.f(endA.ibkr)}</div>
    <p class="hero-sub">${second(endA.ibkr)} · you put in ${M.s(endA.put)}${extra ? ` · <b class="acc">+${M.s(endB.ibkr - endA.ibkr)}</b> with ticked ideas` : ''}</p>
    ${extra ? `<div class="lines"><span><i style="background:var(--muted)"></i>Current plan</span><span><i style="background:var(--accent)"></i>With ideas</span></div>` : '<div style="height:12px"></div>'}
    ${chart(A, extra ? B : null, M)}
  </div>
  ${group('ETF settings',
      row('Account currency', null, {end:seg('p.etf.cur', M.c, ['EUR','USD','AED'], 'IBKR account currency')})
    + row('IBKR now', num('p.ibkrHold.amt', heldIn(p, M.c), {d2:true, label:'IBKR balance now in ' + M.c}), {tag:'label', unit:unitC})
    + row('Return a year', num('p.etf.ret', p.etf.ret, {dec:true, label:'Assumed yearly return, percent'}), {tag:'label', unit:'%'})
    + row('Years', null, {end:`<div class="stepper"><button type="button" data-act="years" data-d="-1" aria-label="Fewer years">−</button><b>${p.etf.years}</b><button type="button" data-act="years" data-d="1" aria-label="More years">+</button></div>`})
    + row('Bonus each July', num('p.etf.bonus', p.etf.bonus, {label:'Yearly bonus in USD'}), {tag:'label', unit:'USD', sub:+p.etf.bonus ? `= ${aed(p.etf.bonus / p.usdPerAed)}` : ''})
    + row('WIO savings goal', num('p.wioGoal', p.wioGoal, {label:'WIO savings goal'}), {tag:'label', unit:'AED'}),
    `${hit ? `WIO reaches the goal in ${monthName(hit.key)}; after that every saved dirham goes to IBKR.` : `WIO does not reach the goal within ${p.etf.years} years.`} Assumes ${nfr.format(p.etf.ret)}% a year after fees, every year. Markets go up and down, so this is arithmetic, not a forecast.`)}
  ${group('Milestones', marks.map(y => { const a = A[Math.min(y*12, A.length-1)], b = B[Math.min(y*12, B.length-1)];
      return row(`${y} year${y > 1 ? 's' : ''}`, M.f(a.ibkr), {cap:`${monthName(a.key)} · put in ${M.s(a.put)}`, sub:extra ? `${M.f(b.ibkr)} with ideas` : ''}); }).join(''))}
  ${group('Possible savings', ideas, extra ? `Ticked ideas free up ${aed(extra)} a month (${aed(extra * 12)} a year). Invested monthly, that is about ${M.f(fv(extra, n, i))} after ${p.etf.years} years.` : 'Switch an idea on to see what it adds. Tap a target to try a smaller cut.')}
  <section class="group"><h2 class="g-title">Savings plan</h2>
    <div class="plan-card">
      <table class="plan">${head}<thead><tr><th>Month</th><th>Saved</th><th>WIO</th><th>IBKR ${unitC}</th></tr></thead><tbody>${plan.slice(0,13).map(tr).join('')}</tbody></table>
      <details><summary>Show the next 12 months</summary><table class="plan">${head}<tbody>${plan.slice(13).map((r,k) => tr(r, k + 13)).join('')}</tbody></table></details>
    </div>
    <p class="g-foot">The first row is ${monthName(key)} with what you entered. Saved and WIO in AED.</p>
  </section>`;
}

function chart(A, B, M){
  const W = 640, H = 300, L = 70, Rr = 14, T = 16, Bm = 36;
  const n = A.length - 1, v = r => r.ibkr * M.r;
  const top = Math.max(...A.map(v), ...(B ? B.map(v) : []), 1);
  const pow = Math.pow(10, Math.floor(Math.log10(top)));
  const max = [1,1.5,2,2.5,3,4,5,6,8,10].map(k => k*pow).find(x => x >= top);
  const x = k => L + (W - L - Rr) * k / n, y = val => T + (H - T - Bm) * (1 - val / max);
  const path = rows => rows.map((r,k) => (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v(r)).toFixed(1)).join(' ');
  const yrs = n / 12, step = yrs > 20 ? 5 : yrs > 6 ? 2 : 1;
  let g = '';
  for (let t = 0; t <= 4; t++) { const val = max * t / 4; g += `<line x1="${L}" x2="${W-Rr}" y1="${y(val)}" y2="${y(val)}" stroke="var(--hair)"/><text x="${L-10}" y="${y(val)+6}" text-anchor="end">${short(val)}</text>`; }
  for (let yr = 0; yr <= yrs; yr += step) g += `<text x="${x(yr*12)}" y="${H-8}" text-anchor="middle">${yr ? yr + ' y' : 'now'}</text>`;
  const main = B || A;
  const area = path(main) + ` L${x(n)} ${y(0)} L${x(0)} ${y(0)} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="IBKR balance in ${M.c} over ${yrs} years">${g}
    <path d="${area}" fill="var(--accent-soft)"/>
    ${B ? `<path d="${path(A)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
    <path d="${path(main)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${x(n)}" cy="${y(v(main[n]))}" r="4" fill="var(--accent)"/></svg>`;
}

/* ---------- Settings: theme, and where your data lives ---------- */
// Bump together with CACHE in sw.js on every release, so phones pick it up.
const APP_VERSION = 14, APP_DATE = '24 Nov 2026';
const theme = () => { try { return localStorage.getItem('budget-theme') || 'auto'; } catch(e) { return 'auto'; } };
function setTheme(v){
  try { if (v === 'auto') localStorage.removeItem('budget-theme'); else localStorage.setItem('budget-theme', v); } catch(e) {}
  if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  const dark = v === 'dark' || (v === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);

function banner(){
  if (sync.newer) return `<button type="button" class="banner tap" data-act="update-app"><b>A newer version of this app is ready</b><span>Tap to update this device. Anything you changed here is kept and uploads after it.</span></button>`;

function snapFocus(){

// Each step lists what it is made of; the lines add up to the step's amount.
function stepsFor(p, R, m){
  const st = [], lb = {...LABELS, ...(p.text || {})};
  const fee = p.hsbcFee;
  // the lines as shown (whole dirhams) must add up to the total as shown
  const tail = (parts, total) => { const d = Math.round(total) - parts.reduce((t, [, v]) => t + Math.round(v), 0); if (d) parts.push([d > 0 ? 'Rounded up' : 'Rounded down', d]); return parts; };
  st.push({id:'usd', t:`WIO: change ${usd(R.salaryUsd)} to AED`, d:R.received ? `${aed(R.incomeMonth)} arrived; the exchange cost ${aed(R.fxLoss)}` : `About ${aed(R.incomeMonth)} after WIO’s exchange cost`, a:aed(R.incomeMonth)});
  const diffLine = (left, where) => left >= 0.5 ? [[`Left over in ${where} (sent, no longer needed)`, left]] : left <= -0.5 ? [['Still to send', left]] : [];
  const sentNote = (left, where) => left >= 0.5 ? `You sent ${r0(left)} more than now needed. It stays in ${where} and counts as already there next month` : left <= -0.5 ? `A cost went up after you sent it: ${aed(-left)} still to send` : '';
  if (R.nbdSend > 0 || R.sentNbd != null) { const tot = R.sentNbd != null ? R.sentNbd : R.nbdSend;
    st.push({id:'nbd', t:'WIO → NBD', d:sentNote(R.nbdLeft, 'NBD'), a:aed(tot), total:tot,
      parts:[...tail([...R.nbdParts, ...(R.extraNbd ? [['Already in NBD', -R.extraNbd]] : [])], R.nbdSend), ...diffLine(R.nbdLeft, 'NBD')]}); }
  const mort = R.row('mortdxb');
  if (R.nbdLeft <= -0.5) st.push({id:'nbd-more', t:'WIO → NBD: send the rest', d:'A cost went up after the first transfer', a:aed(-R.nbdLeft)});
  if (R.direct && mort && !mort.paid) {
    const tot = R.sentPartner != null ? R.sentPartner : R.toPartner;
    const note = R.partnerLeft >= 0.5 ? `You sent ${aed(R.partnerLeft)} more than the share is now` : R.partnerLeft <= -0.5 ? `The share went up after you sent it: ${aed(-R.partnerLeft)} still to send`
      : R.dewaTyped ? lb.partnerNote : `Type this month’s ${lb.utility} in Month first; this uses the usual ${r0(R.dewaDxb)}`;
    st.push({id:'toPartner', t:`WIO → ${lb.partner}’s NBD`, d:note, a:aed(tot), total:tot,
      parts:[...tail([[mort.name, mort.aed], ['Internet', -p.dxb.internet], ['Service fee (usual)', -p.dxb.service], [`${lb.utility} ${lb.home}`, -R.dewaDxb]], R.toPartner),

    if (R.partnerLeft <= -0.5) st.push({id:'partner-more', t:`WIO → ${lb.partner}’s NBD: send the rest`, d:'The share went up after the first transfer', a:aed(-R.partnerLeft)});
  }
  if (R.hsbcTotal > 0 || R.sentHsbc != null) { const tot = R.sentHsbc != null ? R.sentHsbc : R.hsbcTotal;
    st.push({id:'hsbc', t:'WIO → HSBC → REVO', d:sentNote(R.hsbcLeft, 'Revo') || `About ${aed(tot - fee)} lands in Revo`, a:aed(tot), total:tot,
      parts:[...tail([...R.revoParts, ...(R.extraRevo ? [['Already in Revo', -R.extraRevo]] : []), ...(R.toIbkr ? [['Savings for IBKR', R.toIbkr]] : []), ['HSBC fee, about', fee]], R.hsbcTotal), ...diffLine(R.hsbcLeft, 'Revo')]}); }
  if (R.hsbcLeft <= -0.5) st.push({id:'hsbc-more', t:'WIO → HSBC → REVO: send the rest', d:'A cost went up after the first transfer', a:aed(-R.hsbcLeft)});
  if (R.zaba > 0) st.push({id:'zaba', t:'REVO → ZABA in EUR', a:eur(R.zaba), total:R.zaba, cur:'EUR', parts:R.zabaParts.map(([n, v]) => [n, v])});
  const rent = R.row('rentjp');

// The lines under a step, with the sum at the bottom

function setPath(root, parts, val){

/* ---------- saving: on this device first, then a file in your private GitHub repo ---------- */
// The key is typed into this device by you and kept only in this device's storage.
const cfg = {owner:location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : '', repo:'budget-data', path:'data.json', token:''};

const sync = {sha:null, dirty:false, last:null, timer:null, busy:false, pulling:false, prev:null, pushedAt:0, base:null, newer:false};

let editRev = 0;

const SYNC = {local:'Not connected', checking:'Checking…', saving:'Saving…', synced:'Synced', offline:'Offline · saved here', auth:'Key not accepted', norepo:'Repo not reachable', error:'Sync failed · saved here'};
const showSync = () => document.querySelectorAll('.sync').forEach(e => { e.innerHTML = `<span>${SYNC[S.sync]}</span><span class="vn">v${APP_VERSION}</span>`; e.dataset.s = S.sync; });
const setSync = (s, redraw) => { S.sync = s; if (redraw) render(); else showSync(); };
const connected = () => !!(cfg.token && cfg.owner && cfg.repo);
const isPhone = () => device() === 'iPhone';   // the phone is the main device
const device = () => /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Macintosh/.test(navigator.userAgent) ? 'Mac' : 'browser';

const b64e = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };

function gh(method, body){
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
  const signal = AbortSignal.timeout ? AbortSignal.timeout(20000) : undefined;   // a request that never answers must not block the next one
  return fetch(url, {method, signal, cache:'no-store', headers:{Authorization:'Bearer ' + cfg.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(body ? {'Content-Type':'application/json'} : {})}, body:body ? JSON.stringify(body) : undefined});
}
function applyRemote(doc){
  if (!doc || typeof doc !== 'object' || !doc.plan) return false;
  S.plan = mergePlan(doc.plan); S.months = doc.months || {}; cache();
  return true;
}
async function readRemote(){
  const r = await gh('GET');
  if (r.status === 404) {
    // "Not found" also means the key can't see the repo: tell those apart
    const repo = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, {cache:'no-store', headers:{Authorization:'Bearer ' + cfg.token, Accept:'application/vnd.github+json'}});
    if (repo.status === 401) return {auth:true};
    return repo.ok ? {missing:true} : {norepo:true};
  }
  if (r.status === 401 || r.status === 403) return {auth:true};
  if (!r.ok) return {error:true};

/* Changed on both devices: keep what each one changed. Where both changed the same thing, the phone's is kept. */
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const canon = v => JSON.stringify(v, (k, x) => isObj(x) ? Object.fromEntries(Object.keys(x).sort().map(n => [n, x[n]])) : x);
const same = (a, b) => canon(a) === canon(b);
const WHOLE = ['frozen', 'rates'];   // only make sense as one piece
function merge3(base, mine, theirs, mineWins, name){
  if (same(mine, theirs)) return mine;
  if (base !== undefined && same(mine, base)) return theirs;
  if (base !== undefined && same(theirs, base)) return mine;
  if (isObj(mine) && isObj(theirs) && !WHOLE.includes(name)) {
    const out = {};
    for (const k of new Set([...Object.keys(theirs), ...Object.keys(mine)])) {
      const v = merge3(isObj(base) ? base[k] : undefined, mine[k], theirs[k], mineWins, k);
      if (v !== undefined) out[k] = v;
    }
    return out;
  }
  if (base === undefined && mine === undefined) return theirs;
  if (base === undefined && theirs === undefined) return mine;
  return mineWins ? mine : theirs;
}
function setBase(doc){ sync.base = clone({plan:doc.plan, months:doc.months}); try { localStorage.setItem('budget-sync-base', JSON.stringify(sync.base)); } catch(e) {} }
// Take in the copy from GitHub, together with anything changed here and not uploaded yet
function absorb(res){
  const theirs = {plan:mergePlan(res.doc.plan), months:res.doc.months || {}}, mine = {plan:S.plan, months:S.months};
  let next = theirs;
  if (sync.dirty) next = sync.base ? merge3({plan:mergePlan(sync.base.plan), months:sync.base.months || {}}, mine, theirs, isPhone()) : isPhone() ? mine : theirs;
  S.plan = clone(next.plan); S.months = clone(next.months);
  sync.dirty = sync.dirty && !same(next, theirs);
  sync.sha = res.sha; sync.last = res.doc.savedAt || sync.last;

}
// The other device runs a newer version: an old version must not save over what it wrote
function tooOld(doc){
  sync.newer = !!doc && doc.appV > APP_VERSION;

  return sync.newer;
}

// Fetch the latest copy from GitHub. Quiet = the regular check while the app is open.
async function pull(quiet){
  if (!connected()) return setSync('local');
  if (!navigator.onLine) return setSync('offline');
  if (sync.busy || sync.pulling) return;
  if (!quiet) setSync('checking');
  const at = sync.sha;
  let res;
  sync.pulling = true;
  try { res = await readRemote(); } catch(e) { return setSync('offline'); } finally { sync.pulling = false; }
  if (sync.busy || sync.sha !== at) return;                                    // saved meanwhile: this answer is already old
  if (res.auth) return setSync('auth', true);
  if (res.norepo) return setSync('norepo', true);
  if (res.error) return setSync('error');
  if (res.missing) { sync.sha = null; return sync.dirty ? push() : setSync('synced'); }
  if (!res.doc || typeof res.doc !== 'object' || !res.doc.plan) return setSync('error');
  if (res.sha === sync.prev && Date.now() - sync.pushedAt < 60000) return setSync('synced');   // GitHub still answering with the copy before our save
  if (tooOld(res.doc)) { absorb(res); return setSync('synced', true); }
  if (res.sha === sync.sha) { setBase({plan:mergePlan(res.doc.plan), months:res.doc.months || {}}); if (sync.dirty) return push(); setSync('synced', S.sync === 'auth'); return settlePast(); }
  absorb(res); setSync('synced', true);
  if (sync.dirty) return push();
  settlePast();
}

async function push(tries = 0){
  clearTimeout(sync.timer);
  if (!connected() || sync.busy || sync.newer) return;
  if (!navigator.onLine) return setSync('offline');
  sync.busy = true; setSync('saving');
  const rev = editRev;
  const doc = clone({app:'budget-savings', v:1, appV:APP_VERSION, savedAt:new Date().toISOString(), device:device(), plan:S.plan, months:S.months});
  let r = null;
  try { r = await gh('PUT', {message:`Saved on ${doc.device}`, content:b64e(JSON.stringify(doc, null, 1)), ...(sync.sha ? {sha:sync.sha} : {})}); } catch(e) {}
  if (r && (r.status === 409 || r.status === 422)) {   // the other device saved first: put the two together and save again
    let res = null;
    try { res = await readRemote(); } catch(e) {}
    sync.busy = false;
    if (res && res.doc && res.doc.plan && res.sha !== sync.sha && tries < 3) {
      const old = tooOld(res.doc);
      absorb(res); setSync('synced', true);
      return sync.dirty && !old ? push(tries + 1) : undefined;
    }
    return setSync('error');
  }
  sync.busy = false;
  if (!r) return setSync('offline');
  if (r.ok) {
    const j = await r.json();
    sync.prev = sync.sha; sync.pushedAt = Date.now(); sync.sha = j.content.sha; sync.last = doc.savedAt; setBase(doc);
    if (editRev === rev) sync.dirty = false; else sync.timer = setTimeout(() => push(), 1500);
    saveSyncState(); return setSync('synced', S.sync === 'auth');
  }
  if (r.status === 401 || r.status === 403 || r.status === 404) return setSync('auth', true);
  setSync('error');
}

function queueSave(){
  editRev++; sync.dirty = true; saveSyncState();
  if (!connected()) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(() => push(), 2000);
  setSync(navigator.onLine ? 'saving' : 'offline');
}

// The boxes save as you type or paste: closing the app with the cursor still in the box keeps the key.
let cfgTimer = null, cfgSeen = JSON.stringify([cfg.owner, cfg.repo, cfg.token]);
function cfgEdited(el, now){
  if (el) { cfg[el.dataset.cfg] = el.value.trim(); saveCfg(); }
  clearTimeout(cfgTimer);
  const go = () => {
    const sig = JSON.stringify([cfg.owner, cfg.repo, cfg.token]);
    if (sig === cfgSeen && !['local','auth','norepo','error'].includes(S.sync)) return;
    cfgSeen = sig; sync.sha = null; sync.base = null; saveSyncState(); render(); pull();
  };
  if (now) go(); else cfgTimer = setTimeout(go, 900);
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.cfg) cfgEdited(e.target, false); });

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (sync.dirty) push(); } else { pull(); refreshRates(); lookForUpdate(); } });
// A window left open keeps up by itself: on coming back to it, and every 20 seconds while it is on screen
const tick = () => { if (document.visibilityState === 'visible' && navigator.onLine && connected() && !['auth','norepo'].includes(S.sync) && !document.querySelector('input:focus')) pull(true); };
window.addEventListener('focus', () => { tick(); lookForUpdate(); });
setInterval(tick, 20000);
window.addEventListener('online', () => pull());
window.addEventListener('offline', () => setSync('offline'));

// Sync settings, backup, and the choice when both devices changed
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.cfg) { cfgEdited(el, true); return; }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    el.files[0].text().then(t => {
      const doc = JSON.parse(t);
      if (!applyRemote(doc)) throw new Error('not a budget file');
      queueSave(); render(); alert('Restored. It will sync to your other device.');
    }).catch(() => alert('That file is not a Budget + Savings copy.'));
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'sync-now') refreshRates(true);
  if (act === 'sync-now') { if (sync.dirty) push(); else pull(); }
  if (act === 'connect') { document.querySelectorAll('[data-cfg]').forEach(i => { cfg[i.dataset.cfg] = i.value.trim(); }); saveCfg(); if (document.activeElement) document.activeElement.blur(); cfgEdited(null, true); }
  if (act === 'theme') { setTheme(b.dataset.v); render(); }
  if (act === 'update-app') updateApp(true);
  if (act === 'export') {
    const doc = {app:'budget-savings', v:1, appV:APP_VERSION, savedAt:new Date().toISOString(), device:device(), plan:S.plan, months:S.months};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], {type:'application/json'}));
    a.download = `budget-savings-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  if (act === 'forget' && confirm('Forget the GitHub key on this device? Your data stays on GitHub and on this device.')) { cfg.token = ''; saveCfg(); setSync('local', true); }
});

// Keeping the app itself up to date, also in a window that is never closed (never while you're typing)
function updateApp(force){
  if (!force && document.querySelector('input:focus')) return;
  try {
    if (!force && Date.now() - (+sessionStorage.getItem('budget-reload-at') || 0) < 300000) return;   // never reload in a loop
    sessionStorage.setItem('budget-reload-at', Date.now());
  } catch(e) { if (!force) return; }
  const go = () => location.reload();
  if (force && window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go, go); else go();
}
let swReg = null, lookedAt = Date.now();
async function newerHere(){
  try { const n = Math.max(0, ...(await caches.keys()).map(k => +(/^budget-app-v(\d+)$/.exec(k) || [])[1] || 0)); if (n > APP_VERSION) updateApp(false); } catch(e) {}
}
function lookForUpdate(){
  newerHere();
  if (!swReg || Date.now() - lookedAt < 60000) return;
  lookedAt = Date.now(); swReg.update().catch(() => {});
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.addEventListener('controllerchange', newerHere);
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { swReg = r; }).catch(() => {});
  setInterval(() => { if (document.visibilityState === 'visible') lookForUpdate(); }, 600000);
}
if (theme() !== 'auto') setTheme(theme());
S.sync = connected() ? 'checking' : 'local';
render();
pull();
refreshRates();
})();
</script>
</body>
</html>
